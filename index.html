<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="xSMe8NjOJitIbihp_Rs4ctuOhG8ogC3gYNH4PRTPxKA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ENGINE V6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f7ff;
            color: #334155;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        /* ヘッダー */
        .tool-bar {
            background-color: #1e40af;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 12px 24px;
            margin: 12px;
            gap: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(30, 64, 175, 0.2);
            z-index: 10;
        }

        .tool-title {
            font-size: 16px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 入力エリア */
        .input-field {
            background: #fff;
            border: 1px solid #e2e8f0;
            color: #1e3a8a;
            font-size: 13px;
            padding: 6px 12px;
            outline: none;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .label-text {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tool-bar .label-text {
            color: #bfdbfe;
        }

        /* ボタン */
        .btn-sync {
            background-color: #3b82f6;
            color: #fff;
            border: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 24px;
            cursor: pointer;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .btn-sync:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(59, 130, 246, 0.4);
        }

        /* メインエリア */
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            gap: 16px;
            padding: 0 12px 12px 12px;
        }

        .pane {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eef2f6;
        }

        .pane-header {
            background-color: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: #fafcfe;
            color: #1e293b;
            border: none;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        iframe {
            flex: 1;
            background: #fff;
            border: none;
        }

        /* 下部設定バー */
        .settings-bar {
            background-color: #fff;
            margin: 0 12px 12px 12px;
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eef2f6;
            position: relative;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-small {
            font-size: 18px !important;
        }

        /* 住所候補リスト */
        #suggestion-list {
            position: absolute;
            bottom: 60px;
            left: 170px;
            width: 300px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestion-item {
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #eff6ff; color: #1e40af; }

        /* 検索ローディングアニメーション */
        .loader-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
    </style>
</head>
<body>

    <header class="tool-bar">
        <div class="tool-title">
            <span class="material-icons-round">settings_input_component</span>
            SYSTEM_ENGINE_V6
        </div>
        <div class="flex-1 flex gap-8" style="top:99999999999999999999999999;" >
            <div class="setting-item">
                <span class="label-text">
                    <span class="material-icons-round icon-small">videocam</span>
                    Visual_Input
                </span>
                <select id="mock-camera-source" class="input-field">
                    <option value="pattern">Pattern_Test</option>
                    <option value="file">Media_File</option>
                    <option value="screen">Screen_Capture</option>
                </select>
            </div>
            <div class="setting-item">
                <span class="label-text">
                    <span class="material-icons-round icon-small">devices</span>
                    Interface_UA
                </span>
                <select id="mock-ua-preset" class="input-field">
                    <option value="current">Standard_Default</option>
                    <option value="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36">Windows_Chrome</option>
                    <option value="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36">Android_Chrome</option>
                </select>
            </div>
        </div>
        <button id="apply-btn" class="btn-sync">
            <span class="material-icons-round">sync</span>
            SYNC_AND_RELOAD
        </button>
    </header>

    <div class="settings-bar">
        <!-- 住所候補リストコンテナ -->
        <div id="suggestion-list"></div>

        <!-- バッテリー設定 -->
        <div class="setting-item border-r border-slate-100 pr-4">
            <span class="label-text">
                <span class="material-icons-round icon-small text-blue-600">battery_charging_full</span>
                Power
            </span>
            <input type="range" id="mock-battery-level" min="0" max="100" value="85" class="w-24 accent-blue-600">
            <span id="battery-val-display" class="text-[13px] font-bold text-blue-600 w-8 text-center">85%</span>
            <input type="checkbox" id="mock-battery-charging" checked class="w-4 h-4 accent-blue-600">
        </div>
        
        <!-- 住所検索と座標設定 -->
        <div class="setting-item flex-1">
            <span class="label-text">
                <span class="material-icons-round icon-small text-blue-600">location_on</span>
                Geo
            </span>
            <div class="relative flex-1 max-w-[300px]">
                <input type="text" id="address-input" class="input-field w-full pl-8" placeholder="場所を入力して候補を表示..." autocomplete="off">
                <span class="material-icons-round absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">search</span>
                <div id="search-status-icon" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-300">
                    <span class="material-icons-round text-[16px]">pending</span>
                </div>
            </div>
            <div class="flex items-center gap-2 ml-2">
                <input type="number" id="mock-lat" class="input-field w-20" value="35.68" step="0.0001" title="Latitude">
                <input type="number" id="mock-lng" class="input-field w-20" value="139.69" step="0.0001" title="Longitude">
            </div>
        </div>

        <!-- 時間設定 -->
        <div class="setting-item border-l border-slate-100 pl-4">
            <span class="label-text">
                <span class="material-icons-round icon-small text-blue-600">schedule</span>
                Timeline
            </span>
            <input type="checkbox" id="enable-time-mock" class="w-4 h-4 accent-blue-600">
            <input type="datetime-local" id="mock-datetime" class="input-field">
        </div>
    </div>

    <main class="main-grid">
        <section class="pane">
            <div class="pane-header">
                <span class="flex items-center gap-1">
                    <span class="material-icons-round icon-small">code</span>
                    BUFFER_EDITOR
                </span>
                <button id="reset-code-btn" class="text-blue-600 hover:text-blue-800 flex items-center gap-1 font-bold">
                    <span class="material-icons-round icon-small">restart_alt</span>
                    RESET
                </button>
            </div>
            <textarea id="code-editor" spellcheck="false"></textarea>
        </section>

        <section class="pane">
            <div class="pane-header">
                <span class="flex items-center gap-1">
                    <span class="material-icons-round icon-small">preview</span>
                    RUNTIME_PREVIEW
                </span>
                <span id="system-time-display" class="font-bold text-blue-900 bg-blue-50 px-3 py-1 rounded-full text-[12px]">00:00:00</span>
            </div>
            <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
        </section>
    </main>

    <input type="file" id="camera-file-input" class="hidden">

    <script>
        const apiKey = ""; // Provided by environment
        const editor = document.getElementById('code-editor');
        const preview = document.getElementById('preview-frame');
        const applyBtn = document.getElementById('apply-btn');
        const batterySlider = document.getElementById('mock-battery-level');
        const batteryDisplay = document.getElementById('battery-val-display');
        const cameraSourceSelect = document.getElementById('mock-camera-source');
        const cameraFileInput = document.getElementById('camera-file-input');
        const addressInput = document.getElementById('address-input');
        const suggestionList = document.getElementById('suggestion-list');
        const latInput = document.getElementById('mock-lat');
        const lngInput = document.getElementById('mock-lng');
        const statusIcon = document.getElementById('search-status-icon');

        let cameraFileAsset = null;
        let debounceTimer;

        // Clock Update
        setInterval(() => {
            document.getElementById('system-time-display').textContent = new Date().toLocaleTimeString('ja-JP');
        }, 1000);

        // Init Time
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('mock-datetime').value = now.toISOString().slice(0, 16);

        // --- Address Autocomplete & Search Logic ---

        addressInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const query = addressInput.value.trim();
            if (query.length < 2) {
                suggestionList.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(() => fetchSuggestions(query), 500);
        });

        async function fetchSuggestions(query) {
            statusIcon.innerHTML = '<span class="material-icons-round text-[16px] loader-spin">autorenew</span>';
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `"${query}" という入力に対して予測される日本の場所名（住所や施設名）の候補を5つ、JSON配列形式 ["名前1", "名前2", ...] で返してください。説明は不要です。` }] }],
                        tools: [{ "google_search": {} }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const list = JSON.parse(data.candidates[0].content.parts[0].text);
                
                renderSuggestions(list);
            } catch (e) {
                console.error("Suggestions failed", e);
            } finally {
                statusIcon.innerHTML = '<span class="material-icons-round text-[16px]">pending</span>';
            }
        }

        function renderSuggestions(list) {
            suggestionList.innerHTML = '';
            if (!list || list.length === 0) {
                suggestionList.style.display = 'none';
                return;
            }

            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item;
                div.onclick = () => selectLocation(item);
                suggestionList.appendChild(div);
            });
            suggestionList.style.display = 'block';
        }

        async function selectLocation(name) {
            addressInput.value = name;
            suggestionList.style.display = 'none';
            statusIcon.innerHTML = '<span class="material-icons-round text-[16px] loader-spin">sync</span>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `場所「${name}」の正確な緯度と経度を JSON形式 {"lat": number, "lng": number} で教えてください。` }] }],
                        tools: [{ "google_search": {} }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const coords = JSON.parse(data.candidates[0].content.parts[0].text);
                
                if (coords.lat && coords.lng) {
                    latInput.value = coords.lat.toFixed(6);
                    lngInput.value = coords.lng.toFixed(6);
                    updatePreview();
                }
            } catch (e) {
                console.error("Coord fetch failed", e);
            } finally {
                statusIcon.innerHTML = '<span class="material-icons-round text-[16px] text-green-500">check_circle</span>';
                setTimeout(() => statusIcon.innerHTML = '<span class="material-icons-round text-[16px]">pending</span>', 2000);
            }
        }

        // --- End of Geo Logic ---

        const defaultCode = `<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #fff; color: #334155; }
        .card { border: 1px solid #e2e8f0; padding: 20px; background: #f8fafc; border-radius: 12px; }
        h2 { color: #1e3a8a; margin-top: 0; }
        video { width: 100%; max-width: 500px; border: 6px solid #1e3a8a; border-radius: 16px; margin: 10px 0; }
        .data-point { font-family: monospace; font-size: 1.2em; color: #1e40af; }
    </style>
</head>
<body>
    <div class="card">
        <h2>System Telemetry</h2>
        <p>Current Geo: <span id="l" class="data-point">Syncing...</span></p>
        <p>Energy: <span id="b" class="data-point">--</span></p>
    </div>
    <video id="v" autoplay playsinline muted></video>
    <script>
        navigator.getBattery?.().then(b => {
            const up = () => document.getElementById('b').innerText = Math.round(b.level*100) + '%' + (b.charging?' [Charging]':'');
            up(); b.onlevelchange = up; b.onchargingchange = up;
        });
        navigator.geolocation.getCurrentPosition(p => {
            document.getElementById('l').innerText = p.coords.latitude.toFixed(6) + ', ' + p.coords.longitude.toFixed(6);
        });
        async function start() {
            try {
                const s = await navigator.mediaDevices.getUserMedia({video:true});
                document.getElementById('v').srcObject = s;
            } catch(e) {}
        }
        start();
    <\/script>
</body>
</html>`;

        editor.value = defaultCode;

        cameraSourceSelect.addEventListener('change', () => { if(cameraSourceSelect.value === 'file') cameraFileInput.click(); });
        cameraFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) cameraFileAsset = URL.createObjectURL(file);
        });

        batterySlider.addEventListener('input', () => { batteryDisplay.textContent = batterySlider.value + '%'; });

        function generateMockScript() {
            const getVal = id => document.getElementById(id).value;
            const isChecked = id => document.getElementById(id).checked;
            const ua = getVal('mock-ua-preset') === 'current' ? navigator.userAgent : getVal('mock-ua-preset');
            const batt = getVal('mock-battery-level') / 100;
            const charging = isChecked('mock-battery-charging');
            const lat = getVal('mock-lat'); const lng = getVal('mock-lng');
            const timeMock = isChecked('enable-time-mock');
            const timeVal = new Date(getVal('mock-datetime')).getTime();
            const camType = getVal('mock-camera-source');

            return `
                <script>
                (function() {
                    Object.defineProperty(navigator, 'userAgent', { get: () => "${ua.replace(/"/g, '\\"')}", configurable: true });
                    navigator.getBattery = () => Promise.resolve({ level: ${batt}, charging: ${charging}, addEventListener:()=>{}, removeEventListener:()=>{} });
                    navigator.geolocation.getCurrentPosition = (s) => s({ coords: { latitude: ${lat}, longitude: ${lng}, accuracy: 5 }, timestamp: Date.now() });
                    navigator.geolocation.watchPosition = (s) => { s({ coords: { latitude: ${lat}, longitude: ${lng}, accuracy: 5 }, timestamp: Date.now() }); return 1; };
                    
                    if (${timeMock}) {
                        const ODate = window.Date; const drift = ${timeVal} - ODate.now();
                        function MDate(...a) { return a.length === 0 ? new ODate(ODate.now() + drift) : new ODate(...a); }
                        MDate.prototype = ODate.prototype; MDate.now = () => ODate.now() + drift;
                        MDate.UTC = ODate.UTC; MDate.parse = ODate.parse; window.Date = MDate;
                    }

                    navigator.mediaDevices.getUserMedia = async (c) => {
                        if (!c.video) return null;
                        const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 360;
                        const ctx = canvas.getContext('2d');
                        if ("${camType}" === "file" && "${cameraFileAsset || ''}") {
                            const v = document.createElement('video'); v.src = "${cameraFileAsset}"; v.loop = v.muted = true; await v.play();
                            const d = () => { ctx.drawImage(v, 0, 0, 640, 360); requestAnimationFrame(d); }; d();
                        } else {
                            const d = () => {
                                ctx.fillStyle = '#f8fafc'; ctx.fillRect(0,0,640,360);
                                ctx.fillStyle = '#3b82f6'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
                                ctx.fillText('SYSTEM_OPTICS_EMULATOR', 320, 170);
                                ctx.font = '13px monospace'; ctx.fillStyle = '#94a3b8';
                                ctx.fillText('GEO_SYNC: ${lat}, ${lng}', 320, 200);
                                requestAnimationFrame(d);
                            }; d();
                        }
                        return canvas.captureStream(30);
                    };
                })();
                <\/script>
            `;
        }

        function updatePreview() {
            preview.srcdoc = generateMockScript() + editor.value;
        }

        // Close suggestion list on click outside
        document.addEventListener('click', (e) => {
            if (!addressInput.contains(e.target) && !suggestionList.contains(e.target)) {
                suggestionList.style.display = 'none';
            }
        });

        applyBtn.addEventListener('click', updatePreview);
        document.getElementById('reset-code-btn').addEventListener('click', () => { 
            if(confirm('エディタを初期状態に戻しますか？')) { editor.value = defaultCode; updatePreview(); }
        });
        window.onload = updatePreview;
    </script>
</body>
</html>
